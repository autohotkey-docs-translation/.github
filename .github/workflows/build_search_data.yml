name: Build search data

on:
  workflow_call:

jobs:
  build-and-commit-search-data:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        ref: master

    - name: Download AutoHotkey v2 and run build_search.ahk
      run: |
        try {
          $source = "https://www.autohotkey.com/download/ahk-v2.zip"
          $dest = "ahk-v2.zip"
          echo "Downloading $source ..."
          Invoke-WebRequest -Uri $source -OutFile $dest
          echo "Extracting files from $dest ..."
          Expand-Archive -Path $dest
          $path = "ahk-v2/AutoHotkey32.exe"
        }
        catch {
          echo "Download failed: $($_.Exception.Message)"
          echo "Trying GitHub ..."

          $html = Invoke-WebRequest -Uri "https://github.com/AutoHotkey/AutoHotkey/tags"
          $releases = @(
            Select-String -InputObject $html.Content -Pattern 'releases\/tag\/(v\d+\.\d+\.\d+)' -AllMatches |
            ForEach-Object { $_.Matches.Groups[1].Value }
          )
          if ($releases.Count -eq 0) {
            throw "No stable releases found."
          }
          $latest = $releases[0]
          $version = $latest.TrimStart("v")

          echo "Latest stable release: $latest"

          $source = "https://github.com/AutoHotkey/AutoHotkey/releases/download/$latest/AutoHotkey_$version.zip"
          $dest = "ahk-v2.zip"
          echo "Downloading $source ..."
          Invoke-WebRequest -Uri $source -OutFile $dest
          echo "Extracting files from $dest ..."
          Expand-Archive -Path $dest
          $path = "ahk-v2/AutoHotkey32.exe"
        }
        New-Item -Name target\docs\static\source\data_search.js -ItemType File -ea 0
        Start-Process -FilePath $path -ArgumentList "/ErrorStdOut `"target/docs/static/source/build_search.ahk`"" -NoNewWindow -Wait

    - name: Commit
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add target\docs\static\source\data_search.js
        git commit -a -m "Build data_search.js"
        git push
